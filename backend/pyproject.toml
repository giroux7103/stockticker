[project]
name = "stockticker-backend"
version = "0.1.0"
description = "Modular backend for an online stockticker boardgame"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "duckdb>=1.0.0",
  "pydantic>=2.8.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]
